<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FuZev</title>
<style>
:root{font-family:ui-sans-serif,system-ui,sans-serif;color:#1e2529;background:#f5f7f8;font-size:14px;letter-spacing:0}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:#fff;border-bottom:1px solid #d4dde0}h1{font-size:23px;margin:0}h2{font-size:16px;margin:0 0 14px}main{max-width:1440px;margin:auto;padding:24px 28px}section{margin-bottom:28px}#connection{font-size:12px;color:#4f666e}.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-bottom:1px solid #d4dde0;padding-bottom:22px}.meter strong{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:7px}.meter span{font-size:12px;color:#5c6e76}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:30px}.task-list{background:#fff;border-top:1px solid #d4dde0}details{border-bottom:1px solid #e4eaed}details details{margin-left:20px}summary{cursor:pointer;padding:12px 10px;list-style:none;display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:9px;align-items:start}summary::before{content:'\203A';font-size:18px;line-height:18px}details[open]>summary::before{transform:rotate(90deg)}.task-title{overflow-wrap:anywhere}.badge{font-size:11px;font-weight:600;padding:3px 6px;border-radius:3px;white-space:nowrap;color:#586a73;background:#eef2f4}.running{color:#8a5b00;background:#fff0c6}.completed{color:#08643e;background:#dbf4e7}.failed{color:#a82831;background:#ffe0e3}.blocked{color:#834728;background:#f8e4d9}.cancelled{color:#5f646a;background:#e6e8ea}.detail{margin:0 12px 12px 31px;color:#5c6e76;font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}progress{width:100%;height:5px;accent-color:#238872;margin-bottom:7px}canvas{display:block;width:100%;height:160px;background:#fff;border-bottom:1px solid #d4dde0}.legend{display:flex;gap:18px;font-size:12px;margin:9px 0 22px;color:#5c6e76}.dot{display:inline-block;width:7px;height:7px;margin-right:5px;border-radius:50%}.result{padding:12px 0;border-bottom:1px solid #d4dde0}.result-head{font-weight:600;overflow-wrap:anywhere}.result pre{font-size:12px;overflow:auto;max-height:210px;background:#fff;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{color:#6b7c84;font-size:13px;padding:18px 0}#events{font-size:12px;max-height:220px;overflow:auto}.event{padding:7px 0;border-bottom:1px solid #e2e8eb;overflow-wrap:anywhere}@media(max-width:760px){header{padding:16px}main{padding:18px 16px}.meters{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.layout{grid-template-columns:minmax(0,1fr)}summary{grid-template-columns:12px minmax(0,1fr) auto}.meter strong{font-size:21px}}
:root{color-scheme:dark;color:#e5ecef;background:#16191c}header{background:#1e2326;border-color:#364047}#connection,.meter span,.detail,.legend,.empty{color:#a6b4bc}.meters,details,.result,canvas{border-color:#364047}.task-list,canvas,.result pre{background:#1e2326}.event{border-color:#303a40}.badge{color:#b5c2c9;background:#303a40}.running,.in_progress{color:#f5ce7f;background:#463921}.completed{color:#88d9b0;background:#203e32}.failed{color:#ff9da3;background:#49292e}.blocked{color:#e9b091;background:#43332b}.cancelled{color:#bcc1c7;background:#35383c}progress{accent-color:#60c5ad}
</style></head><body><header><h1>FuZev</h1><span id="connection">Connecting</span></header><main>
<section class="meters"><div class="meter"><span>CPU</span><strong id="cpu">--</strong></div><div class="meter"><span>GPU</span><strong id="gpu">--</strong></div><div class="meter"><span>Available RAM</span><strong id="ram">--</strong></div><div class="meter"><span>Swap</span><strong id="swap">--</strong></div></section>
<div class="layout"><div><section><h2>Tasks</h2><div id="tasks" class="task-list"></div></section><section><h2>Activity</h2><div id="events"></div></section></div><div><section><h2>Resource History</h2><canvas id="chart" height="320"></canvas><div class="legend"><span><i class="dot" style="background:#278879"></i>CPU</span><span><i class="dot" style="background:#cb604b"></i>GPU</span><span><i class="dot" style="background:#426fa4"></i>RAM</span></div></section><section><h2>Training &amp; Validation</h2><div id="results"></div></section></div></div>
</main><script>
const $=id=>document.getElementById(id), history=[], expanded=new Set();let taskSignature='', resultSignature='', eventSignature='';
const text=(tag,value,cls)=>{const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e};
function renderTasks(tasks){const signature=JSON.stringify(tasks);if(signature===taskSignature)return;taskSignature=signature;const byParent=new Map();for(const task of tasks){const key=task.parent||'';if(!byParent.has(key))byParent.set(key,[]);byParent.get(key).push(task)}
function branch(task){const d=document.createElement('details');d.open=expanded.has(task.id);d.addEventListener('toggle',()=>{d.open?expanded.add(task.id):expanded.delete(task.id)});const s=document.createElement('summary');s.append(text('span',task.title,'task-title'),text('span',task.status==='in_progress'?'In progress':task.status,'badge '+task.status));d.append(s);const content=document.createElement('div');content.className='detail';if(task.status==='in_progress'){const p=document.createElement('progress');p.max=1;p.value=task.progress;content.append(p)}if(task.detail)content.append(text('div',task.detail));if(task.active_descendants?.length)content.append(text('div','Active: '+task.active_descendants.map(id=>tasks.find(t=>t.id===id)?.title||id).join('; ')));d.append(content);for(const c of byParent.get(task.id)||[])d.append(branch(c));return d}
$('tasks').replaceChildren(...(byParent.get('')||[]).map(branch))}
function plot(){const c=$('chart'),ctx=c.getContext('2d'),w=c.width=Math.max(320,c.clientWidth*2),h=c.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#344047';for(let n=1;n<4;n++){ctx.beginPath();ctx.moveTo(0,n*h/4);ctx.lineTo(w,n*h/4);ctx.stroke()}if(history.length<2)return;const colors=['#60c5ad','#f18d79','#8babdf'];for(let k=0;k<3;k++){ctx.beginPath();ctx.strokeStyle=colors[k];ctx.lineWidth=3;let begun=false;history.forEach((m,i)=>{const val=k===0?m.cpu.reduce((a,b)=>a+b,0)/m.cpu.length:k===1?m.gpu.utilization:100*m.ram_used/m.ram_total;if(val===null){begun=false;return}const x=i*w/(history.length-1),y=h-8-(Math.max(0,Math.min(100,val))/100)*(h-16);begun?ctx.lineTo(x,y):ctx.moveTo(x,y);begun=true});ctx.stroke()}}
function update(state){renderTasks(state.tasks);const m=state.metrics;if(m){$('cpu').textContent=(m.cpu.reduce((a,b)=>a+b,0)/m.cpu.length).toFixed(0)+'%';$('gpu').textContent=m.gpu.utilization===null?'N/A':m.gpu.utilization.toFixed(0)+'%';$('ram').textContent=(m.ram_available/2**30).toFixed(1)+' GiB';$('swap').textContent=(m.swap_used/2**30).toFixed(1)+' GiB';if(!history.length||history.at(-1).timestamp!==m.timestamp){history.push(m);if(history.length>300)history.shift();plot()}}
const rs=JSON.stringify(state.results);if(rs!==resultSignature){resultSignature=rs;$('results').replaceChildren(...(state.results.length?state.results.map(r=>{const d=document.createElement('div');d.className='result';d.append(text('div',r.task,'result-head'),text('pre',JSON.stringify(r.payload,null,2)));return d}):[text('div','No training or validation results yet.','empty')]))}
const es=JSON.stringify(state.events);if(es!==eventSignature){eventSignature=es;$('events').replaceChildren(...state.events.map(e=>{let p;try{p=JSON.parse(e.payload)}catch{p={}}return text('div',new Date(e.timestamp*1000).toLocaleTimeString()+'  '+e.task+'  '+(p.detail||p.status||e.kind),'event')}))}}
fetch('/api/metrics?limit=300').then(r=>r.json()).then(ms=>{history.push(...ms);plot()});const source=new EventSource('/api/events');source.onmessage=e=>{update(JSON.parse(e.data));$('connection').textContent='Live';$('connection').style.color='#88d9b0'};source.onerror=()=>{$('connection').textContent='Reconnecting';$('connection').style.color='#f5ce7f'};new ResizeObserver(plot).observe($('chart'));
</script></body></html>
